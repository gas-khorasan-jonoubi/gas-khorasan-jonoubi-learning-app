name: Flutter checks

on:
  push:
    branches:
      - feature/app-usage-guide
  pull_request:
    branches:
      - feature/fix-exam-and-results
      - main

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded
