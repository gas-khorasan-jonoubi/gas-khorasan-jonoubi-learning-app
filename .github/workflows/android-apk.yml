name: Build Android APK

on:
  push:
    branches: [main, fix/splash-three-seconds-nigc-icon]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Only build an APK when explicitly approved'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org ir.gas.khorasanjonoubi --project-name gas_khorasan_jonoubi_learning_app .
          fi
          rm -f test/widget_test.dart
      - name: Restore the two approved images from the repository bundle
        run: |
          cat tooling/assets_bundle.zip.b64.part.* | tr -d '\n\r ' | base64 --decode > /tmp/gas_assets_bundle.zip
          unzip -oqn /tmp/gas_assets_bundle.zip -d .
      - name: Verify exact selected image assets
        run: |
          test -s assets/app_icon.jpg
          test -s assets/splash_poster.webp
          echo 'e0310a00567f7b4877632119ceba87c862dbf67b20b53e29202fe37e84c7094a  assets/app_icon.jpg' | sha256sum --check -
      - name: Get packages and generate launcher icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Set Persian Android application label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="آموزش شرکت گاز خراسان جنوبی"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not locate android:label")
          manifest.write_text(content, encoding="utf-8")
          PY
      - name: Run tests
        run: flutter test
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        if: github.ref == 'refs/heads/main' || inputs.build_apk == true
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK package ID and signature
        if: github.ref == 'refs/heads/main' || inputs.build_apk == true
        run: |
          expected='ir.gas.khorasanjonoubi.gas_khorasan_jonoubi_learning_app'
          grep -R --fixed-strings "$expected" android/app
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK artifact
        if: github.ref == 'refs/heads/main' || inputs.build_apk == true
        uses: actions/upload-artifact@v4
        with:
          name: gas-khorasan-jonoubi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
