name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'codemagic.yaml'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name gas_khorasan_jonoubi_learning_app .
          fi
      - name: Verify selected image assets
        run: |
          test -s assets/app_icon.jpg
          test -s assets/splash_poster.webp
      - name: Get packages and generate launcher icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Set Persian Android application label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          content, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="آموزش شرکت گاز خراسان جنوبی"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not locate android:label")
          manifest.write_text(content, encoding="utf-8")
          PY
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gas-khorasan-jonoubi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
