name: gas_khorasan_jonoubi_learning_app
description: دانستنی‌های گاز؛ مرجع آفلاین آموزشی
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  material_ui: ^1.11.1
  iran_iap: ^0.3.1
  image_picker: ^1.2.0
  tesseract_ocr: ^0.6.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/approved_splash.png
    - assets/tessdata_config.json
    - assets/tessdata/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.jpg"
  adaptive_icon_background: "#061747"
  adaptive_icon_foreground: "assets/app_icon.jpg"
