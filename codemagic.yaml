
workflows:
  quality-checks:
    name: Danestaniha-ye Gaz - Code Quality Checks
    max_build_duration: 45
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name gas_khorasan_jonoubi_learning_app .
          fi
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze Dart code
        script: flutter analyze
      - name: Run automated tests
        script: flutter test --reporter expanded

  android-release:
    name: Gas Khorasan Jonoubi - Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name gas_khorasan_jonoubi_learning_app .
          fi
      - name: Configure Cafe Bazaar billing host
        script: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android")
          kts = root / "build.gradle.kts"
          groovy = root / "build.gradle"
          gradle = kts if kts.exists() else groovy
          if not gradle.exists():
              raise SystemExit("Android root Gradle file was not generated.")

          source = gradle.read_text(encoding="utf-8")
          if "https://jitpack.io" not in source:
              if kts.exists():
                  snippet = '''
                      maven {
                          url = uri("https://jitpack.io")
                          content {
                              includeGroup("com.github.cafebazaar.Poolakey")
                              includeGroup("com.github.myketstore")
                          }
                      }
                  '''
                  pattern = r'(allprojects\s*\{\s*repositories\s*\{)'
              else:
                  snippet = '''
                      maven {
                          url 'https://jitpack.io'
                      }
                  '''
                  pattern = r'(allprojects\s*\{\s*repositories\s*\{)'
              source, count = re.subn(pattern, lambda match: match.group(1) + snippet, source, count=1)
              if count != 1:
                  raise SystemExit("Could not add JitPack to the Android repositories.")
              gradle.write_text(source, encoding="utf-8")

          activity_files = list((root / "app" / "src" / "main" / "kotlin").rglob("MainActivity.kt"))
          if len(activity_files) != 1:
              raise SystemExit(f"Expected one MainActivity.kt, found {len(activity_files)}.")
          activity = activity_files[0]
          source = activity.read_text(encoding="utf-8")
          source = source.replace(
              "import io.flutter.embedding.android.FlutterActivity",
              "import io.flutter.embedding.android.FlutterFragmentActivity",
          )
          source, count = re.subn(
              r'class MainActivity\s*:\s*FlutterActivity\s*\(\s*\)',
              "class MainActivity : FlutterFragmentActivity()",
              source,
              count=1,
          )
          if count != 1 or "FlutterFragmentActivity" not in source:
              raise SystemExit("Could not configure MainActivity for Bazaar Activity Result API.")
          activity.write_text(source, encoding="utf-8")

          app_kts = root / "app" / "build.gradle.kts"
          app_groovy = root / "app" / "build.gradle"
          app_gradle = app_kts if app_kts.exists() else app_groovy
          if not app_gradle.exists():
              raise SystemExit("Android app Gradle file was not generated.")
          source = app_gradle.read_text(encoding="utf-8")
          if app_kts.exists():
              source, count = re.subn(
                  r'minSdk\s*=\s*flutter\.minSdkVersion',
                  "minSdk = 24",
                  source,
                  count=1,
              )
              if count == 0 and not re.search(r'minSdk\s*=\s*24\b', source):
                  raise SystemExit("Could not set Android minSdk to 24.")
          else:
              source, count = re.subn(
                  r'minSdkVersion\s+flutter\.minSdkVersion',
                  "minSdkVersion 24",
                  source,
                  count=1,
              )
              if count == 0 and not re.search(r'minSdkVersion\s+24\b', source):
                  raise SystemExit("Could not set Android minSdkVersion to 24.")
          app_gradle.write_text(source, encoding="utf-8")
          PY
      - name: Validate Cafe Bazaar release configuration
        script: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          product_id = os.environ.get("BAZAAR_LIFETIME_PRODUCT_ID", "").strip()
          public_key = os.environ.get("BAZAAR_RSA_PUBLIC_KEY", "").strip()
          missing = [
              name for name, value in (
                  ("BAZAAR_LIFETIME_PRODUCT_ID", product_id),
                  ("BAZAAR_RSA_PUBLIC_KEY", public_key),
              )
              if not value
          ]
          if missing:
              raise SystemExit(
                  "Cafe Bazaar release blocked. Configure these Codemagic environment variables: "
                  + ", ".join(missing)
              )

          defines = {
              "IRAN_IAP_STORE": "bazaar",
              "BAZAAR_LIFETIME_PRODUCT_ID": product_id,
              "BAZAAR_RSA_PUBLIC_KEY": public_key,
          }
          target = Path("build/ci-iap-defines.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(defines), encoding="utf-8")
          PY
      - name: Set installed app label
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'android:label="[^"]+"',
              'android:label="دانستنی‌های گاز"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Android app label was not found in the manifest.")
          manifest.write_text(updated, encoding="utf-8")
          PY
      - name: Get Flutter packages
        script: flutter pub get
      - name: Check Cafe Bazaar Android integration
        script: dart run iran_iap doctor --store bazaar
      - name: Analyze Dart code
        script: flutter analyze
      - name: Run automated tests
        script: flutter test --reporter expanded
      - name: Build release APK
        script: flutter build apk --release --dart-define-from-file=build/ci-iap-defines.json
      - name: Verify selected store SDK in release APK
        script: dart run iran_iap verify --store bazaar build/app/outputs/flutter-apk/app-release.apk
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
