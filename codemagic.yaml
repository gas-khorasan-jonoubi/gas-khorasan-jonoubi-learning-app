
workflows:
  android-release:
    name: Gas Khorasan Jonoubi - Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name gas_khorasan_jonoubi_learning_app .
          fi
      - name: Set installed app label
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'android:label="[^"]+"',
              'android:label="دانستنی‌های گاز"',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Android app label was not found in the manifest.")
          manifest.write_text(updated, encoding="utf-8")
          PY
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
